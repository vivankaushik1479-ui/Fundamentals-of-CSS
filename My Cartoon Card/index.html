<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"content=width="device-width",initial scale="1.0">
        <title>My Cartoon Card</title>

        <style>

            /*Universal Selector-Applies to everything in the page*/
            */{
                font-size: 16px;
            }

            /*Element Selectors*/
            body{
                background-color: lightyellow;
            }

            h1{
                color: darkblue;
            }

            h2{
                color: purple;
            }

            p{
                color: dimgray;
            }

            /*Class Selector*/
            .cartoon detail{
                color: darkgreen;
                font-weight: bold;
            }

            /*ID Selector*/
            #cartoon-card{
                background-color: lightcyan;
            }
        </style>
        
        </head>

        <body>


        <h1>My Cartoon card</h1>

        <!--Inline CSS-->

        <p style="color: crimson;>Meet My favourite cartton character!</p>

        <div id="cartoon-card">

        <h2>About My character</h2>

        <p class="cartoon-detail">Character Name:Doraemon</p>
        <p class="cartoon-detail">Best Friend:Nobita</p>
        <p class="cartoon-detail">Favourite food:Dorayaki</p>
        <p class="cartoon-detail">Special Power:Future Gadgets</p>

        </div>

        <h2>Why I like This Character</h2>

        <p>Doraemon is kind,helpful and funny</p>
        <p>He always help his froends</p>
        <p>He teaches us about friendship and creativity</p>

        </body>
        </html>
