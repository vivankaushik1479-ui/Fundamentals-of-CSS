<!DOCTYPE html>
<html>

<head>
    <title>My Pet Page</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightyellow;
            padding: 65px 30px;
            min-height: 1800px;
        }

        h1,
        h2 {
            color: darkorange;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: darkorange;
            color: white;
            padding: 14px;
        }

        .list-item {
            background: white;
            border: 2px solid darkorange;
            padding: 0px;
            margin: 5px 0;
        }

        .special-note {
            position: relative;
            left: 30px;
            background: gold;
            padding: 10px;
        }

        .pet-card {
            position: relative;
            background: white;
            border: 3px solid darkorange;
            padding: 15px;
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: forestgreen;
            color: white;
            padding: 4px 8px;
        }

        .section-label{
            position: sticky;
            top: 55px;
            background: darkorange;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="top-bar">My Pet Page-Buddy</div>
    <h1>Meet Buddy!</h1>
    <h2>Static</h2>
    <div class="list-item">Breed-Labrador|Age : 2</div>
    <h2>Relative</h2>
    <div class="special-note">Pet of the Month</div>
    <h2>Absolute</h2>
    <div class="pet-card">Buddy- Labrador <div class="badge">Adopted!</div>
    </div>
    <h2>Sticky</h2>
    <div class="section-label">More Pets Available</div>
    <div class="list-item">Luna-Poodle</div>
    <div class="list-item">Max-German Shepherd</div>
    <div class="list-item">Daisy-Beagle</div>
</body>
</html>
