<!DOCTYPE html>
<html>

<head>
    <title>My Superhero Card</title>
    <style>
        /*Typography-font,size,weight,color for the whole page*/
        body{
            background-color: darkblue;
            color: white;
            font-family: arial,sans serif;
        }

        /*Typograohy+text shadow - big bold title with an orange shadow*/
        .hero-name{
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
        }

        .tagline {
            font-size: italic;
            color: lightblue;
            text-transform: capitalize;
        }

        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }

        .power{
            font-weight: bold;
            color: lightgreen;
        }

        .weakness{
            text-decoration: line-through;
            color: gray;
        }

        .badge{
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform:rotate(15deg) ;
        }

        .made by{
            color: coral;
            font-size: italic;
        }
    </style>
</head>

<body>

    <h1class="hero-name"></h1class>Thunder Kid</h1>
    <p class="tagline">Most powerful hero in school</p>

    <h2 class="label">Superpowers</h2>
    <p class="power">Can run fast than a cheetah</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label">weakness</h2>
    <p class="weakness">Maths Homework</p>
    <p class="weakness">Brocoli</p>

    <p class="badge">Top Hero</p>

    <p class="made by">Created by Vivan</p>
</body>

</html>
